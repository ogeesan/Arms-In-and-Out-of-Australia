[project]
name = "ausarms-data"
version = "0.1.0"
description = "Analysis of Australian arms trade data."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.5",
    "matplotlib>=3.10.5",
    "mkdocs-material>=9.7.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "pdfplumber>=0.11.9",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "scilayout>=0.1.0b1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.43",
    "tqdm>=4.67.1",
    "typer>=0.21.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "ipython>=9.4.0",
    "pandas-stubs>=2.3.2.250827",
    "pyqt5>5.0.0",
    "pyqt5-qt5==5.15.2",
    "pytest>=9.0.2",
]

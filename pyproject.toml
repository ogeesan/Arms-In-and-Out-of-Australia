[project]
name = "ausarms-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.5",
    "matplotlib>=3.10.5",
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "psycopg2>=2.9.10",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.1.1",
    "scilayout>=0.1.0b1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.43",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "ipython>=9.4.0",
    "pandas-stubs>=2.3.2.250827",
    "pyqt5>5.0.0",
    "pyqt5-qt5==5.15.2",
]
